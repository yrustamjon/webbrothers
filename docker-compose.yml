services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bmp
      POSTGRES_DB: bmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni sozlang}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bmp -d bmp]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://bmp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni sozlang}@postgres/bmp
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      BMP_DEVELOPMENT: ${BMP_DEVELOPMENT:-1}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports: [127.0.0.1:8080:80]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
