[tool.ruff]
required-version = "==0.14.10"
target-version = "py312"
line-length = 88
extend-exclude = [".deps", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations are immutable descriptors, not stateful defaults.
extend-immutable-calls = ["fastapi.Depends"]
