name: Tekshiruvlar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bmp
          POSTGRES_PASSWORD: ci-only-local
          POSTGRES_DB: bmp
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bmp -d bmp"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://bmp:ci-only-local@localhost:5432/bmp
      TEST_DATABASE_URL: postgresql+psycopg://bmp:ci-only-local@localhost:5432/bmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r apps/api/requirements-dev.txt PyYAML
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - run: python -m pytest apps/api/tests
        env: {PYTHONPATH: "apps/api:packages/security"}
      - run: alembic upgrade head
        working-directory: apps/api
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s packages/security/tests -v
        env: {PYTHONPATH: packages/security}
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bmp
          POSTGRES_PASSWORD: ci-only-local
          POSTGRES_DB: bmp
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bmp -d bmp"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://bmp:ci-only-local@localhost:5432/bmp
      TEST_DATABASE_URL: postgresql+psycopg://bmp:ci-only-local@localhost:5432/bmp
      PUBLIC_ORIGIN: https://localhost:8443
      PYTHONPATH: apps/api:packages/security
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v5
        with: {go-version: 'stable'}
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - run: go build -o /tmp/browser-agent ./cmd/browser-agent
        working-directory: agent
      - run: alembic upgrade head
        working-directory: apps/api
      - name: Haqiqiy HTTPS WSS agent integratsiyasi
        shell: bash
        run: |
          set -euo pipefail
          scripts/local-tls.sh /tmp/bmp-ci-tls
          python -m uvicorn bmp.main:app --host 127.0.0.1 --port 8443 --ssl-keyfile /tmp/bmp-ci-tls/server.key --ssl-certfile /tmp/bmp-ci-tls/server.pem --no-access-log &
          bmp_api_pid=$!
          trap 'kill "$bmp_api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --cacert /tmp/bmp-ci-tls/ca.pem https://localhost:8443/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          python scripts/smoke.py --base-url https://localhost:8443 --ca-file /tmp/bmp-ci-tls/ca.pem --agent /tmp/browser-agent
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: apps/web
      - run: npm run format:check && npm test && npm run build
        working-directory: apps/web
  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: 'stable'}
      - run: go test -race ./...
        working-directory: agent
        env: {CGO_ENABLED: '1'}
      - run: go vet ./...
        working-directory: agent
        env: {CGO_ENABLED: '1'}
      - run: go build -o bin/ ./cmd/browser-agent
        working-directory: agent
        env: {CGO_ENABLED: '1'}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-imzosiz-sinov-${{ matrix.os }}
          path: agent/bin/*
