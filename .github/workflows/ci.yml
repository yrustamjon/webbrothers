name: Tekshiruvlar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bmp
          POSTGRES_PASSWORD: ci-only-local
          POSTGRES_DB: bmp
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bmp -d bmp"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://bmp:ci-only-local@localhost:5432/bmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r apps/api/requirements.txt PyYAML
      - run: python -m pytest apps/api/tests
        env: {PYTHONPATH: "apps/api:packages/security"}
      - run: alembic upgrade head
        working-directory: apps/api
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s packages/security/tests -v
        env: {PYTHONPATH: packages/security}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: apps/web
      - run: npm test && npm run build
        working-directory: apps/web
  agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x'}
      - run: go test -race ./...
        working-directory: agent
        env: {CGO_ENABLED: '1'}
      - run: go vet ./...
        working-directory: agent
        env: {CGO_ENABLED: '1'}
      - run: go build -o bin/ ./cmd/browser-agent
        working-directory: agent
        env: {CGO_ENABLED: '1'}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-imzosiz-sinov-${{ matrix.os }}
          path: agent/bin/*
