<h1>HTTP metadata</h1><p>Faqat ruxsat berilgan saytlardagi metod, domen, status va davomiylik yuboriladi. Agent joriy kompyuterda ishlashi kerak. Aniq profilni avtomatik aniqlash mavjud emas.</p>
<label>Mahalliy agent ulash kaliti<input id="key" type="password" autocomplete="off"></label>
<label>Brauzer<select id="browser"><option value="chrome">Chrome</option><option value="edge">Edge</option><option value="brave">Brave</option><option value="firefox">Firefox</option></select></label>
<button id="enable">Sayt ruxsatini berish va yoqish</button><button id="disable">Toʻxtatish va kalitni oʻchirish</button><p id="status" role="status"></p>
